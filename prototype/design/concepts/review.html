<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>概念图审阅 · 拾荒娃娃机</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #121216;
      --line: #26262c;
      --ink: #e8e4dc;
      --dim: #8a8680;
      --accent: #f0c419;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr auto;
    }
    header {
      grid-column: 1 / -1;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
    header p { font-size: 12px; color: var(--dim); }
    header .sets a { margin-right: 10px; }
    header .sets a.on { color: var(--accent); font-weight: 600; }
    nav {
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 8px 0;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    nav button:hover { background: #1a1a20; }
    nav button.active {
      background: #1c1c24;
      border-left-color: var(--accent);
      color: var(--accent);
    }
    nav .meta { color: var(--dim); font-size: 11px; }
    main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px 20px;
    }
    .caption {
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .caption strong { color: var(--accent); }
    .frame {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08080a;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    footer {
      grid-column: 1 / -1;
      padding: 10px 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    footer kbd {
      padding: 2px 6px;
      border: 1px solid #444;
      border-radius: 3px;
      color: var(--ink);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
      nav { max-height: 160px; border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>概念图审阅</h1>
    <p class="sets">
      <a id="linkSeedream" href="?set=seedream">Seedream 厚涂</a>
      <a id="linkCursor" href="?set=cursor">Cursor 写实</a>
    </p>
    <p id="setNote">顺序见 <code>review-order.json</code></p>
  </header>
  <nav id="nav" aria-label="幻灯片列表"></nav>
  <main>
    <p class="caption" id="caption"></p>
    <div class="frame">
      <img id="img" alt="" />
    </div>
  </main>
  <footer>
    <span id="path"></span>
    <span><kbd>←</kbd> <kbd>→</kbd> 切换 · <kbd>Home</kbd> 首张 · <kbd>End</kbd> 末张</span>
  </footer>
  <script type="module">
    const nav = document.getElementById('nav');
    const img = document.getElementById('img');
    const caption = document.getElementById('caption');
    const pathEl = document.getElementById('path');

    /** Hub 用 /concepts 打开时 pathname 不在 concepts 目录，资源统一走 /design/concepts/ */
    function conceptsDirUrl() {
      const p = location.pathname;
      if (p === '/concepts' || p === '/concepts/') return `${location.origin}/design/concepts/`;
      if (p.includes('/design/concepts/')) {
        const dir = p.replace(/[^/]*$/, '');
        return `${location.origin}${dir}`;
      }
      return new URL('./', location.href).href;
    }

    const CONCEPTS = conceptsDirUrl();
    const set = new URLSearchParams(location.search).get('set') === 'cursor' ? 'cursor' : 'seedream';
    const orderFile = set === 'cursor' ? 'review-order-cursor.json' : 'review-order.json';
    document.getElementById('linkSeedream').classList.toggle('on', set === 'seedream');
    document.getElementById('linkCursor').classList.toggle('on', set === 'cursor');
    document.getElementById('setNote').innerHTML =
      set === 'cursor'
        ? 'Cursor 写实摄影组 · <code>review-order-cursor.json</code>'
        : 'Seedream 厚涂 · <code>review-order.json</code>';

    function resolveAsset(rel) {
      if (rel.startsWith('/')) return rel;
      if (rel.startsWith('../../assets/')) return '/' + rel.slice(6);
      if (rel.startsWith('../')) return '/design/' + rel.slice(3);
      return CONCEPTS + rel;
    }

    const data = await fetch(CONCEPTS + orderFile).then(r => {
      if (!r.ok) throw new Error('无法加载 review-order.json');
      return r.json();
    });

    const slides = [...data.slides].sort((a, b) => a.order - b.order);
    let index = 0;

    function hrefFor(rel) {
      return resolveAsset(rel);
    }

    function show(i) {
      index = Math.max(0, Math.min(slides.length - 1, i));
      const s = slides[index];
      const src = hrefFor(s.path);
      img.src = src;
      img.alt = s.label;
      caption.innerHTML = `<strong>${String(s.order).padStart(2, '0')}</strong> · ${s.act} — ${s.label}`;
      pathEl.textContent = s.path;
      nav.querySelectorAll('button').forEach((btn, j) => {
        btn.classList.toggle('active', j === index);
      });
      nav.querySelector('button.active')?.scrollIntoView({ block: 'nearest' });
    }

    slides.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML = `<span class="meta">${String(s.order).padStart(2, '0')} · ${s.act}</span><br>${s.label}`;
      btn.addEventListener('click', () => show(i));
      nav.appendChild(btn);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(index - 1);
      else if (e.key === 'ArrowRight') show(index + 1);
      else if (e.key === 'Home') show(0);
      else if (e.key === 'End') show(slides.length - 1);
    });

    show(0);
  </script>
</body>
</html>
