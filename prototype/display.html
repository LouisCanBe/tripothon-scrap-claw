<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>出货展示 · 拾荒娃娃机</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      --bg: #0a0a0e;
      --fg: #f0ece0;
      --line: rgba(240,236,224,.25);
      --flash: #0a0a0c;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    /* 白底模式：暖白，与相框页同色系；现场搭白展台时用 */
    body.light {
      --bg: #f3f0e8;
      --fg: #1c1916;
      --line: rgba(28,25,22,.22);
      --flash: #e6dfd0;
    }
    header, footer {
      flex-shrink: 0;
      padding: 1rem 1.25rem;
      z-index: 2;
    }
    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.12em; opacity: 0.75; }
    #prizeName { font-size: clamp(1.5rem, 4vw, 2.4rem); margin-top: 0.35rem; }
    #prizeMeta { font-size: 0.9rem; opacity: 0.65; margin-top: 0.25rem; }
    #stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
    }
    #stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #link { font-size: 0.8rem; opacity: 0.55; margin-bottom: 0.35rem; }
    #status { font-size: 0.85rem; opacity: 0.7; }
    #cta {
      padding: 0.65rem 1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0.85;
    }
    #cta[hidden] { display: none; }
    #ctaRow {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }
    /* 白底/深底切换：现场布展用的工具按钮，不是主交互 */
    #bgBtn {
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      opacity: 0.7;
      touch-action: manipulation;
      transition: background .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease;
    }
    #bgBtn:hover { opacity: 1; background: rgba(128,128,128,.14); }
    /* 「揭晓」：把展台上的东西换成它真实的样子。
       这是副屏唯一的交互 —— 主屏演的是"他以为的"，这里让观众亲手翻面。 */
    #revealBtn {
      padding: 0.65rem 1.2rem;
      border: 1px solid rgba(240,196,25,.55);
      border-radius: 6px;
      background: rgba(240,196,25,.08);
      color: #f0c419;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      touch-action: manipulation;
      transition: background .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease;
    }
    #revealBtn:hover { background: rgba(240,196,25,.18); }
    #revealBtn[hidden] { display: none; }
    #revealBtn.revealed { color: #c8bda6; border-color: rgba(200,189,166,.4); background: transparent; }
    /* 白底下黄色对比度不够，换深金 */
    body.light #revealBtn { color: #8a6d00; border-color: rgba(138,109,0,.5); background: rgba(138,109,0,.06); }
    body.light #revealBtn:hover { background: rgba(138,109,0,.14); }
    body.light #revealBtn.revealed { color: #6b6355; border-color: rgba(107,99,85,.4); background: transparent; }
    /* 揭晓瞬间：画面压一下，再亮起真相 */
    #stage.reveal-flash::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background: var(--flash);
      animation: revealFlash 900ms ease both;
      z-index: 5;
    }
    @keyframes revealFlash {
      0%   { opacity: 0; }
      22%  { opacity: 1; }
      55%  { opacity: 0.9; }
      100% { opacity: 0; }
    }
    #prizeName.flip { animation: nameFlip 900ms ease both; }
    @keyframes nameFlip {
      0%   { opacity: 1; }
      22%  { opacity: 0; }
      55%  { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>COLLECT DISPLAY</h1>
    <div id="prizeName">等待出货…</div>
    <div id="prizeMeta"></div>
  </header>
  <div id="stage"></div>
  <footer>
    <div id="link">同步：—</div>
    <div id="status">先开主游戏或先开本页均可；配对一致即可联动出货</div>
    <div id="ctaRow">
      <button id="bgBtn" type="button">白 底</button>
      <button id="revealBtn" type="button" hidden>揭 晓</button>
      <span id="cta" hidden data-slot="promo">营销位预留 · 可按 prizeId 接文案/链接/视频</span>
    </div>
  </footer>
  <script type="module" src="./src/displayMain.js"></script>
</body>
</html>
