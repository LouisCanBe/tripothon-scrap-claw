<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拾荒娃娃机 · 灰盒原型 v0.1</title>
<script>
  // 调试钩子：收集运行时错误，便于自动化验证
  window.__errs = [];
  addEventListener('error', e => __errs.push(String(e.message)));
  addEventListener('unhandledrejection', e => __errs.push(String(e.reason)));
</script>
<link rel="stylesheet" href="./theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--color-bg); }
  body { font-family: var(--font-main); color: var(--color-ink); }

  /* 舞台：canvas 始终全窗口渲染，用 clip-path 控制可见画幅（见 frameMask.js）
     —— 这是 outline 定的方案：不渲染进 RT，遮罩切视口，16:9 展开零成本 */
  #stage { position: fixed; inset: 0; transition: clip-path 1.15s cubic-bezier(.65,0,.25,1);
           touch-action: none;   /* 触控手势交给 pointerControls，禁止浏览器滚动/缩放接管 */ }
  #stage.no-anim { transition: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* 旧照片式白框（与 clip 区域同步，由 JS 定位） */
  #frameBorder { position: fixed; pointer-events: none; z-index: 5;
                 border: 5px solid rgba(240,236,224,.88); border-radius: 2px;
                 box-shadow: 0 0 80px rgba(0,0,0,.85);
                 transition: all 1.15s cubic-bezier(.65,0,.25,1); }
  #frameBorder.no-anim { transition: none; }

  /* 黑屏闪（终幕"硬切"降级方案用） */
  #flash { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 20; }

  /* —— 配额面板：游戏任务卡 —— */
  #hud { position: fixed; top: 20px; left: 20px; z-index: 10; font-size: var(--font-size-hud);
         line-height: 1.9; text-shadow: var(--text-shadow); user-select: none; pointer-events: none;
         padding: 13px 18px 12px; background: rgba(9,9,12,.55);
         border: 1px solid rgba(216,212,200,.20); border-radius: 10px; }
  #hud .hud-title { font-size: 11px; letter-spacing: 3px; color: var(--color-ink-dim);
                    padding-left: 8px; border-left: 3px solid var(--color-accent); margin-bottom: 7px; }
  #hud .hud-count { margin-top: 6px; font-size: 12px; color: var(--color-accent); }
  #globalGrabStat { position: fixed; left: 20px; bottom: 52px; z-index: 10; font-size: 11px; letter-spacing: 1px;
                    color: var(--color-ink-dim); text-shadow: var(--text-shadow); pointer-events: none; user-select: none;
                    padding: 6px 10px; background: rgba(9,9,12,.45); border-radius: 6px;
                    border: 1px solid rgba(216,212,200,.12); }
  #revealBeat { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,.92); pointer-events: none; opacity: 0; transition: opacity .6s; }
  #revealBeat.show { opacity: 1; }
  #revealBeat .reveal-beat-inner { text-align: center; max-width: min(90vw, 420px); }
  #revealBeat .reveal-beat-visual { margin-bottom: 18px; }
  #revealBeat .reveal-beat-visual img { display: block; max-width: min(92vw, 720px); max-height: 48vh;
    margin: 0 auto; border-radius: 4px; box-shadow: 0 12px 40px rgba(0,0,0,.55);
    border: 1px solid rgba(240,236,224,.15); object-fit: contain; }
  #revealBeat .reveal-beat-text { font-size: 15px; line-height: 1.75; letter-spacing: 2px; white-space: pre-line;
    color: var(--color-ink); text-shadow: var(--text-shadow); }
  #hud .quest { position: relative; padding-left: 20px; transition: color .3s; }
  #hud .quest::before { content: ''; position: absolute; left: 3px; top: 50%; width: 9px; height: 9px;
                        transform: translateY(-50%); border: 1px solid var(--color-ink-dim);
                        border-radius: 50%; transition: all .3s; }
  #hud .quest.done { color: var(--color-accent); text-decoration: line-through; }
  #hud .quest.done::before { background: var(--color-accent); border-color: var(--color-accent);
                             animation: questPop .38s cubic-bezier(.3,1.6,.5,1); }
  @keyframes questPop { 50% { transform: translateY(-50%) scale(1.7); } }
  #hud .hud-count { margin-top: 8px; padding-top: 7px; border-top: 1px dashed rgba(216,212,200,.16);
                    font-size: 11px; letter-spacing: 2px; color: var(--color-ink-dim); }
  #hud .hud-count span { color: var(--color-ink); font-size: 15px; }
  /* 副屏：右上角单卡折叠 / 展开（第三幕起） */
  #collectPairPanel { position: fixed; top: 18px; right: 18px; z-index: 11;
                      max-width: min(280px, 56vw); pointer-events: auto;
                      background: rgba(9,9,12,.78); border: 1px solid rgba(216,212,200,.22);
                      border-radius: 8px; overflow: hidden; }
  #collectPairPanel[hidden] { display: none !important; }
  #collectPairPanel[data-state="wait"] { border-color: rgba(216,180,120,.35); }
  #collectPairPanel[data-state="ok"] { border-color: rgba(140,180,140,.35); }
  #collectPairPanel[data-state="err"] { border-color: rgba(201,160,106,.4); }
  #collectPairPanel .collect-pair-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 7px 10px; font-size: 10px; letter-spacing: 1px;
    color: var(--color-ink-dim); background: transparent; border: none;
    cursor: pointer; font-family: inherit; text-align: left;
  }
  #collectPairPanel .status-title { flex: 1; color: var(--color-ink); letter-spacing: 1.5px; }
  #collectPairPanel .collect-pair-head .chev { opacity: .7; transition: transform .2s; }
  #collectPairPanel.open .collect-pair-head .chev { transform: rotate(90deg); }
  #collectPairPanel .collect-pair-expand { padding: 0 10px 10px; text-align: center;
                                           border-top: 1px dashed rgba(216,212,200,.14); }
  #collectPairPanel .collect-pair-expand[hidden] { display: none; }
  #collectPairPanel .pair-wait[hidden] { display: none; }
  #collectPairPanel canvas { display: block; margin: 8px auto 6px; border-radius: 4px;
                             image-rendering: pixelated; }
  #collectPairPanel .pair-url-row { display: flex; gap: 6px; align-items: stretch; }
  #collectPairPanel .pair-url {
    flex: 1; min-width: 0; font-size: 9px; line-height: 1.35; padding: 5px 6px;
    color: var(--color-ink); background: rgba(0,0,0,.35); border: 1px solid rgba(216,212,200,.16);
    border-radius: 4px; font-family: inherit; user-select: all; -webkit-user-select: all;
  }
  #collectPairPanel .pair-copy {
    flex: 0 0 auto; padding: 0 8px; font-size: 9px; letter-spacing: 1px;
    color: var(--color-ink); background: rgba(216,212,200,.12);
    border: 1px solid rgba(216,212,200,.22); border-radius: 4px; cursor: pointer;
    font-family: inherit;
  }
  #collectPairPanel .pair-hint { margin-top: 6px; font-size: 9px; line-height: 1.45;
                                letter-spacing: .5px; color: var(--color-ink-dim); text-align: left; }
  #collectPairPanel .pair-err-text { font-size: 9px; line-height: 1.45; color: var(--color-ink-dim);
                                     text-align: left; padding-top: 8px; }

  /* —— 字幕条：底条背板（打字机逻辑在 director.msg）—— */
  #msg { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); z-index: 10;
         max-width: 82%; padding: 9px 24px; text-align: center;
         font-size: var(--font-size-msg); color: var(--color-ink); text-shadow: var(--text-shadow);
         background: rgba(8,8,10,.58); border: 1px solid rgba(216,212,200,.14); border-radius: 22px;
         opacity: 0; transition: opacity .4s; pointer-events: none; white-space: nowrap; }
  /* 终幕那行手写体：给 #msg 加 .stinger 类即可（JS: msgEl.classList.add('stinger')） */
  #msg.stinger { font-family: var(--font-hand); font-size: 24px; letter-spacing: 2px;
                 background: none; border: none; }
  #hint { position: fixed; bottom: 14px; width: 100%; text-align: center; z-index: 10;
          font-size: var(--font-size-hint); color: var(--color-ink-dim);
          letter-spacing: var(--letter-spacing); pointer-events: none; transition: opacity .5s; }

  /* —— 漫画旁白框（二/三幕两侧）—— */
  .panel { position: fixed; top: 50%; left: 5%; transform: translateY(-50%) rotate(-.8deg);
           width: 24%; max-width: 330px; padding: 18px 20px; z-index: 8; pointer-events: none;
           background: #efe9dc; color: #26241f; font-size: 15px; line-height: 1.9;
           white-space: pre-line; border: 2px solid #26241f; box-shadow: 4px 4px 0 rgba(0,0,0,.45);
           opacity: 0; transition: opacity .6s; }
  .panel.right { left: auto; right: 5%; transform: translateY(-50%) rotate(.7deg); }
  .panel.show { opacity: 1; }

  /* —— 幕标题卡（两侧细线装饰）—— */
  #actLabel { position: fixed; top: 8%; width: 100%; text-align: center; z-index: 9;
              font-size: 15px; letter-spacing: 6px; color: var(--color-ink);
              opacity: 0; transition: opacity .8s; pointer-events: none; }
  #actLabel::before, #actLabel::after { content: ''; display: inline-block; width: 64px; height: 1px;
              background: var(--color-ink-dim); vertical-align: middle; margin: 0 20px; opacity: .55; }
  #actLabel.show { opacity: .9; }

  /* —— 收集飘字 / 提示 toast —— */
  #toasts { position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%); z-index: 15;
            display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { padding: 7px 18px; font-size: 14px; color: #26241f; background: #efe9dc;
           border: 2px solid #26241f; border-radius: 4px; box-shadow: 3px 3px 0 rgba(0,0,0,.45);
           opacity: 0; transform: translateY(12px) rotate(-1deg);
           transition: opacity .25s, transform .25s; }
  .toast.in  { opacity: 1; transform: translateY(0) rotate(-1deg); }
  .toast.out { opacity: 0; transform: translateY(-26px) rotate(1deg); transition-duration: .45s; }

  /* —— 视角指示点（左/正/右机位）—— */
  #viewDots { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 10;
              display: flex; gap: 9px; pointer-events: none; opacity: .85; }
  #viewDots i { width: 6px; height: 6px; border-radius: 50%; background: transparent;
                border: 1px solid var(--color-ink-dim); transition: all .35s; }
  #viewDots i.on { background: var(--color-ink); border-color: var(--color-ink); transform: scale(1.35); }

  /* —— 四幕合成演出 —— */
  #synth { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
  .syn-card { position: fixed; bottom: 12%; width: 110px; padding: 12px 0; text-align: center;
              background: #efe9dc; color: #26241f; border: 2px solid #26241f;
              box-shadow: 3px 3px 0 rgba(0,0,0,.4); opacity: 0;
              transition: all .9s cubic-bezier(.5,0,.2,1); }
  #synCard0 { left: 30%; } #synCard1 { left: 46%; } #synCard2 { left: 62%; }
  .syn-card.show { opacity: 1; bottom: 18%; }
  .syn-card.merge { left: 46%; bottom: 46%; opacity: 0; transform: scale(.6) rotate(6deg); }
  #menuCard { position: fixed; left: 50%; top: 44%; transform: translate(-50%,-50%) scale(.9);
              padding: 22px 34px; background: #f7f1e2; color: #26241f; border: 2px solid #26241f;
              box-shadow: 0 0 60px rgba(255,190,120,.35); text-align: center; line-height: 2;
              font-size: 16px; white-space: pre-line; opacity: 0; transition: all 1.2s; }
  #menuCard.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .lil-gui { z-index: 30 !important; --background-color: rgba(14,14,16,.94); }

  /* —— 设计稿叠加层（G 切换，逻辑见 designOverlay.js）—— */
  #designOverlay { position: fixed; inset: 0; z-index: 35; display: none; overflow: hidden; }
  #designOverlay img { position: absolute; left: 50%; top: 50%; max-width: 100vw; max-height: 100vh;
                       transform: translate(-50%, -50%); pointer-events: none; user-select: none; }
  #designOverlay .d-status { position: absolute; right: 12px; bottom: 10px; padding: 4px 12px;
                             font-size: 11px; color: var(--color-ink-dim); background: rgba(8,8,10,.7);
                             border-radius: 4px; pointer-events: none; }

  /* —— 加载闸门：GLB 全部就位才开演（线上资产走网络，避免演到一半换装）—— */
  #loading { position: fixed; inset: 0; z-index: 40; background: #070708;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 16px; transition: opacity .7s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .title { font-size: 28px; letter-spacing: 12px; color: var(--color-ink);
                    text-indent: 12px; margin-bottom: 8px; }
  #loading .t { font-size: 13px; letter-spacing: 4px; color: var(--color-ink-dim); }
  #loading .bar { width: 220px; height: 2px; background: #2a2a2e; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--color-ink);
                    transition: width .3s; }
  #loading .pct { font-size: 11px; letter-spacing: 2px; color: var(--color-ink-dim); }

  /* —— 屏幕按钮（触屏自动显示，桌面 H 面板开关；逻辑见 onscreenButtons.js）—— */
  #touchUI { position: fixed; inset: 0; z-index: 25; pointer-events: none;
             user-select: none; -webkit-user-select: none; }
  #touchUI button { pointer-events: auto; font-family: var(--font-main); color: var(--color-ink);
                    background: rgba(20,20,24,.42); border: 1px solid rgba(216,212,200,.4);
                    border-radius: 8px; cursor: pointer; touch-action: none;
                    transition: transform .08s, background .12s;
                    -webkit-tap-highlight-color: transparent; }
  #touchUI button:active { background: rgba(216,212,200,.25); transform: scale(.9); }
  #touchUI .move-panel { position: fixed; left: 14px; bottom: 40px; display: flex;
                         flex-direction: column; align-items: flex-start; gap: 6px;
                         pointer-events: auto; }
  #touchUI .joystick-base { width: 116px; height: 116px; border-radius: 50%;
                            background: rgba(20,20,24,.38); border: 1px solid rgba(216,212,200,.35);
                            position: relative; touch-action: none; cursor: grab;
                            pointer-events: auto; }
  #touchUI .joystick-base:active { cursor: grabbing; }
  #touchUI .joystick-knob { width: 46px; height: 46px; border-radius: 50%;
                            position: absolute; left: 50%; top: 50%;
                            transform: translate(-50%, -50%);
                            background: rgba(216,212,200,.22); border: 1px solid rgba(216,212,200,.55);
                            pointer-events: none; }
  #touchUI .move-mode { font-size: 11px; letter-spacing: 1px; padding: 5px 12px;
                        width: auto; height: auto; border-radius: 6px; opacity: .85; }
  #touchUI .dpad { display: grid; grid-template-areas: ". up ." "left down right"; gap: 8px; }
  #touchUI .dpad[hidden], #touchUI .joystick[hidden] { display: none !important; }
  #touchUI .pad { width: 52px; height: 52px; font-size: 16px; }
  #touchUI .pad.up { grid-area: up; } #touchUI .pad.down { grid-area: down; }
  #touchUI .pad.left { grid-area: left; } #touchUI .pad.right { grid-area: right; }
  #touchUI .acts { position: fixed; right: 18px; bottom: 46px; display: flex;
                   align-items: flex-end; gap: 12px; pointer-events: auto; }
  #touchUI .act.view { width: 56px; height: 40px; font-size: 13px; }
  #touchUI .act.drop { width: 72px; height: 72px; border-radius: 50%; font-size: 20px;
                       border-color: rgba(216,212,200,.65); }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="frameBorder"></div>
  <div id="flash"></div>

  <div id="collectPairPanel" hidden data-state="wait">
    <button type="button" class="collect-pair-head" aria-expanded="false">
      <span class="status-title">出货副屏</span>
      <span class="chev" aria-hidden="true">▸</span>
    </button>
    <div class="collect-pair-expand" hidden>
      <div class="pair-wait">
        <canvas width="84" height="84" aria-label="出货副屏链接二维码"></canvas>
        <div class="pair-url-row">
          <input type="text" class="pair-url" readonly spellcheck="false" aria-label="副屏地址" />
          <button type="button" class="pair-copy">复制</button>
        </div>
        <div class="pair-hint"></div>
      </div>
      <div class="pair-err-text" hidden></div>
    </div>
  </div>

  <div id="hud">
    <div class="hud-title">今日采集配额</div>
    <div class="quest" id="q-bread">面包 ×1</div>
    <div class="quest" id="q-can">罐头 ×1</div>
    <div class="quest" id="q-veg">蔬菜 ×1</div>
    <div class="hud-count">配额进度 <span id="questProgress">0</span>/3</div>
  </div>
  <div id="globalGrabStat" hidden>本局入洞 <span id="globalGrabCount">0</span> 次</div>
  <div id="toasts"></div>
  <div id="viewDots"><i data-v="left"></i><i data-v="front" class="on"></i><i data-v="right"></i></div>
  <div id="panelLeft" class="panel"></div>
  <div id="panelRight" class="panel right"></div>
  <div id="actLabel"></div>
  <div id="synth" hidden>
    <div class="syn-card" id="synCard0"></div>
    <div class="syn-card" id="synCard1"></div>
    <div class="syn-card" id="synCard2"></div>
    <div id="menuCard"></div>
  </div>
  <div id="revealBeat" hidden>
    <div class="reveal-beat-inner">
      <div class="reveal-beat-visual">
        <img src="assets/images/reveal-truth-hand-can-arcane-flare-16x9.png" alt="" width="1280" height="720" />
      </div>
      <p class="reveal-beat-text"></p>
    </div>
  </div>
  <div id="msg"></div>
  <div id="hint"></div>
  <div id="loading"><div class="title">拾荒娃娃机</div><div class="t">上货中……</div><div class="bar"><i id="loadFill"></i></div><div class="pct" id="loadPct">0%</div></div>

  <script src="./vendor/qrcode-generator.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
