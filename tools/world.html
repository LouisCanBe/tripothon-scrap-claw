<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marble 世界预览器</title>
<link rel="stylesheet" href="/console-theme.css" />
<style>
  :root { --bg: #0b0b0d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
               font-family: ui-monospace, "Courier New", monospace; color: var(--ink); }
  #bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; flex-wrap: wrap;
         background: #121216; border-bottom: 1px solid #26262c; font-size: 13px; }
  #bar b { color: var(--accent); }
  select, button { background: #1c1c22; color: var(--ink); border: 1px solid #3a3a44;
                   padding: 5px 10px; border-radius: 4px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #111; }
  #stage { position: fixed; inset: 52px 0 0 0; }
  body.panel #stage, body.panel #empty { left: 340px; }
  #panel { position: fixed; top: 52px; left: 0; bottom: 0; width: 340px; overflow: auto;
           background: #101014; border-right: 1px solid #26262c; padding: 14px 16px; z-index: 3;
           display: none; font-size: 12px; }
  body.panel #panel { display: block; }
  #panel h2 { font-size: 12px; letter-spacing: 2px; color: var(--dim); font-weight: normal; margin: 12px 0 6px; }
  #panel label { display: block; color: var(--dim); margin: 8px 0 3px; }
  #panel input, #panel textarea, #panel select { width: 100%; background: #1c1c22; color: var(--ink);
    border: 1px solid #3a3a44; border-radius: 4px; padding: 6px 8px; font: inherit; }
  #panel textarea { min-height: 72px; resize: vertical; }
  #panel button.primary { width: 100%; margin-top: 12px; background: var(--accent); color: #111; border-color: var(--accent); }
  #panel .hint { color: var(--dim); margin-top: 8px; line-height: 1.5; }
  #genStatus { margin-top: 10px; color: var(--accent); white-space: pre-wrap; }
  #stage canvas { display: block; }
  #info { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: var(--dim);
          background: rgba(8,8,10,.7); padding: 4px 10px; border-radius: 4px; pointer-events: none; }
  #empty { position: fixed; inset: 52px 0 0 0; display: grid; place-items: center; color: var(--dim); }
  #empty[hidden] { display: none !important; }   /* 关键：display:grid 会覆盖 hidden 属性，提示层一直拦截鼠标 */
</style>
</head>
<body>
<div id="bar">
  <b>Marble 世界预览</b>
  <select id="fileSel"></select>
  <button id="btnPano">全景图</button>
  <button id="btnMesh">GLB 网格</button>
  <button id="btnSplat">SPZ 点云</button>
  <button id="btnGen" type="button">生成</button>
  <span id="cost" style="color:var(--dim)"></span>
  <button id="btnBal" type="button" title="刷新积分">↻</button>
</div>
<aside id="panel">
  <h2>生成世界</h2>
  <label>输入</label>
  <select id="inKind">
    <option value="text">文本</option>
    <option value="image">图片 URL</option>
    <option value="pano">全景图 URL</option>
    <option value="video">视频 URL</option>
  </select>
  <div id="textWrap">
    <label>Prompt</label>
    <textarea id="prompt" placeholder="塌顶废墟，尘光，远处一台仍亮着的娃娃机，前景一只手伸向锈罐头"></textarea>
  </div>
  <div id="urlWrap" hidden>
    <label>本地文件</label>
    <input id="mediaFile" type="file" accept="image/png,image/jpeg,image/webp,video/mp4" />
    <label>或公网 URL（二选一）</label>
    <input id="mediaUrl" placeholder="https://…" />
  </div>
  <label>模型</label>
  <select id="model">
    <option value="marble-1.0-draft">draft · 150 积分（测试）</option>
    <option value="marble-1.1">1.1 · 约 1580 积分</option>
    <option value="marble-1.1-plus">1.1-plus · 约 1500–3000 积分</option>
  </select>
  <label>文件名前缀</label>
  <input id="slug" placeholder="reveal-ruins" />
  <button class="primary" id="btnSubmit" type="button">提交并下载</button>
  <p class="hint">文本直接生成。图片（jpg/png/webp）、全景、视频（mp4）可以选本地文件，也可以填公网 URL。图片和视频可再写一句补充描述。完成后自动保存全景、碰撞 GLB、100k SPZ。</p>
  <div id="genStatus"></div>
</aside>
<div id="stage"></div>
<div id="empty" hidden>把 .png / .glb / .spz 拖进来，或从左上选已下载的资产</div>
<div id="info"></div>

<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
</script>
<script type="module">
// ============================================================
// Marble 资产三模式预览（= 接入正式游戏前的渲染技术验证）：
//   全景图  球内贴图 + 拖拽环视     → 终幕实景背景的最简方案
//   GLB     碰撞网格 + orbit        → 现有 prizePool 管线同款
//   SPZ     gaussian-splats-3d 库   → 写实世界最佳观感（最重）
// ============================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as GSplat from '/vendor/addons/gaussian-splats-3d.js';
import { SceneControls, SceneControlPresets, attachGlobalKeys } from '/src/sceneControls.js';
import { SceneControls, SceneControlPresets, attachGlobalKeys } from '/src/sceneControls.js';

const stage = document.getElementById('stage');
const info = document.getElementById('info');
const empty = document.getElementById('empty');
const fileSel = document.getElementById('fileSel');
let cleanup = null;   // 当前模式的销毁函数

// ---------- 共用场景控制（prototype/src/sceneControls.js） ----------
const globalKeys = attachGlobalKeys();
let activeCtl = null;

function mountSceneControls(camera, canvas, presetName, extra = {}) {
  activeCtl?.dispose();
  const preset = SceneControlPresets[presetName];
  const ctl = new SceneControls(camera, {
    canvas,
    mode: preset.mode,
    features: { ...preset.features },
    ...extra,
  });
  ctl.setEnabled(true);
  ctl.apply();
  activeCtl = ctl;
  return ctl;
}

addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'v' || e.repeat) return;
  const t = e.target.tagName; if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  activeCtl?.toggleMode();
});

function baseScene() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, stage.clientWidth / stage.clientHeight, 0.05, 200);
  const onResize = () => {
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    camera.aspect = stage.clientWidth / stage.clientHeight;
    camera.updateProjectionMatrix();
  };
  addEventListener('resize', onResize);
  let raf;
  const loop = (fn) => { let last; const tick = (t) => { const dt = Math.min((t - (last ?? t)) / 1000, 0.1); last = t; fn?.(t, dt); renderer.render(scene, camera); raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };
  return { renderer, scene, camera, loop, dispose: () => { cancelAnimationFrame(raf); removeEventListener('resize', onResize); renderer.dispose(); renderer.domElement.remove(); } };
}

// ---------- 模式 1：全景图 ----------
function showPano(url) {
  const { scene, camera, loop, dispose, renderer } = baseScene();
  new THREE.TextureLoader().load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = tex;
    scene.backgroundIntensity = 1;
    info.textContent = '全景图 · 第一人称环视：拖拽转视线 / 滚轮 FOV（接入游戏：scene.background 一行的事）';
  });
  mountSceneControls(camera, renderer.domElement, 'panoLook', { eye: [0, 0, 0] });
  loop((t, dt) => activeCtl.tick(dt, globalKeys.keys));
  return dispose;
}

// ---------- 模式 2：GLB 网格 ----------
function showMesh(url) {
  const { scene, camera, loop, dispose, renderer } = baseScene();
  scene.background = new THREE.Color(0x141418);
  scene.add(new THREE.HemisphereLight(0xfff2dd, 0x191a20, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 5, 4); scene.add(key);
  const grid = new THREE.GridHelper(20, 20, 0x333340, 0x222228); scene.add(grid);
  // 默认环视（检视模型），V 切第一人称（走进场景）
  let sizeTxt = '加载中…';
  const setInfo = (m) => info.textContent = `GLB 网格 · ${sizeTxt} · ${m === 'fps' ? '第一人称' : '环视'}：拖拽转视角 / WASD·方向键前后左右 / QE 升降 / 滚轮${m === 'fps' ? ' FOV' : '缩放'} / V 切换范式 · 边界内活动（线框为墙）`;
  mountSceneControls(camera, renderer.domElement, 'orbitInspect', { onModeChange: setInfo });
  new GLTFLoader().load(url, (gltf) => {
    gltf.scene.rotation.x = Math.PI;   // Marble GLB 同样是反的
    scene.add(gltf.scene);
    // 翻转后重新落地：包围盒底贴回 y=0
    const box = new THREE.Box3().setFromObject(gltf.scene);
    gltf.scene.position.y -= box.min.y;
    const size = box.getSize(new THREE.Vector3());
    // 落地后的精确包围盒 → 边界墙（收缩 0.3m 防贴墙看穿模），线框可视化
    const worldBox = new THREE.Box3().setFromObject(gltf.scene);
    activeCtl.setBounds(worldBox);
    scene.add(new THREE.Box3Helper(worldBox, 0x3a4a5a));
    sizeTxt = `${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}m`;
    setInfo(activeCtl.mode);
  });
  loop((t, dt) => activeCtl.tick(dt, globalKeys.keys));
  return dispose;
}

// ---------- 模式 3：SPZ 高斯点云 ----------
async function showSplat(url) {
  const viewer = new GSplat.Viewer({
    rootElement: stage,
    cameraUp: [0, 1, 0],
    sharedMemoryForWorkers: false,
    useBuiltInControls: false,   // 关掉库自带控制，统一用 sceneControls
  });
  await viewer.addSplatScene(url, { progressiveLoad: false, rotation: [1, 0, 0, 0] });   // Marble SPZ 坐标系与 three 相反：绕 X 翻 180°
  viewer.start();
  const setInfo = (m) => info.textContent = `SPZ 点云 · ${m === 'fps' ? '第一人称' : '环视'}：拖拽转视角 / WASD·方向键前后左右 / QE 升降 / 滚轮${m === 'fps' ? ' FOV' : '缩放'} / V 切换范式 · 边界内活动`;
  mountSceneControls(viewer.camera, viewer.renderer.domElement, 'fpsWalk', { orbitMax: 20, onModeChange: setInfo });
  const spzBounds = new THREE.Box3(new THREE.Vector3(-8, 0.2, -8), new THREE.Vector3(8, 4, 8));
  activeCtl.setBounds(spzBounds, 0);
  try { viewer.scene.add(new THREE.Box3Helper(spzBounds, 0x3a5a4a)); } catch {}
  let last, raf;
  const step = (t) => { const dt = Math.min((t - (last ?? t)) / 1000, 0.1); last = t; activeCtl.tick(dt, globalKeys.keys); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  setInfo('fps');
  return () => { cancelAnimationFrame(raf); try { viewer.dispose(); } catch {} };
}

// ---------- 调度 ----------
function open(url) {
  cleanup?.(); cleanup = null;
  activeCtl?.dispose(); activeCtl = null;
  stage.innerHTML = '';   // 清残留：SPZ Viewer 自带的 DOM dispose 不一定移除干净
  empty.hidden = true;
  const ext = url.split('.').pop().toLowerCase();
  const name = decodeURIComponent(url.split('/').pop());
  document.querySelectorAll('#bar button[data-m]').forEach(b => b.classList.remove('on'));
  const mode = ext === 'png' || ext === 'jpg' || ext === 'webp' ? 'pano' : ext === 'glb' ? 'mesh' : 'splat';
  document.querySelector(`#bar button[data-m="${mode}"]`)?.classList.add('on');
  info.textContent = `加载中… ${name}`;
  if (mode === 'pano') cleanup = showPano(url);
  else if (mode === 'mesh') cleanup = showMesh(url);
  else showSplat(url).then(d => cleanup = d).catch(e => info.textContent = 'SPZ 加载失败：' + e.message);
}

// 强制切模式（比如想用点云看 GLB 之外的文件时用不到，但 tab 要能用）
document.getElementById('btnPano').dataset.m = 'pano';
document.getElementById('btnMesh').dataset.m = 'mesh';
document.getElementById('btnSplat').dataset.m = 'splat';

// ---------- 文件列表 ----------
async function refreshFiles() {
  const { files } = await fetch('/api/marble/files').then(r => r.json()).catch(() => ({ files: [] }));
  fileSel.innerHTML = '<option value="">选择已下载资产…</option>' +
    files.map(f => `<option value="/worlds/${encodeURIComponent(f)}">${f}</option>`).join('');
  if (!files.length) empty.hidden = false;
}
fileSel.addEventListener('change', () => fileSel.value && open(fileSel.value));
refreshFiles();

async function refreshCredits() {
  const el = document.getElementById('cost');
  try {
    const b = await fetch('/api/marble/credits').then(async r => {
      const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
    });
    el.textContent = 'API 积分 ' + b.remaining_credits;
  } catch (e) { el.textContent = '积分 ' + e.message; }
}
document.getElementById('btnBal').onclick = refreshCredits;
refreshCredits();

document.getElementById('btnGen').onclick = () => document.body.classList.toggle('panel');
document.getElementById('inKind').onchange = () => {
  const text = document.getElementById('inKind').value === 'text';
  document.getElementById('urlWrap').hidden = text;
  document.querySelector('#textWrap label').textContent = text ? 'Prompt' : '补充描述（可选）';
};
document.getElementById('btnSubmit').onclick = async () => {
  const btn = document.getElementById('btnSubmit');
  const status = document.getElementById('genStatus');
  const kind = document.getElementById('inKind').value;
  const prompt = document.getElementById('prompt').value.trim();
  const body = { model: document.getElementById('model').value, displayName: document.getElementById('slug').value.trim() || undefined, text: prompt || undefined };
  if (kind === 'text' && !prompt) { status.textContent = '请填写 prompt'; return; }
  btn.disabled = true;
  try {
    if (kind !== 'text') {
      const file = document.getElementById('mediaFile').files?.[0];
      const url = document.getElementById('mediaUrl').value.trim();
      if (file) {
        status.textContent = '上传文件…';
        const upKind = kind === 'video' ? 'video' : 'image';
        const up = await fetch('/api/marble/upload?filename=' + encodeURIComponent(file.name) + '&kind=' + upKind, { method: 'POST', body: file }).then(async r => {
          const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
        });
        body.mediaAssetId = up.media_asset_id;
        body.kind = upKind;
        if (kind === 'pano') body.isPano = true;
        if (kind === 'image') body.isPano = false;
      } else if (/^https?:\/\//.test(url)) {
        if (kind === 'image') body.imageUrl = url;
        else if (kind === 'pano') body.panoUrl = url;
        else body.videoUrl = url;
      } else throw new Error('请选择本地文件，或填写 http(s) 地址');
    }
    status.textContent = '提交中…';
    const gen = await fetch('/api/marble/gen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(async r => {
      const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
    });
    const opId = gen.operation_id ?? gen.id ?? gen.name;
    if (!opId) throw new Error('未返回 operation_id：' + JSON.stringify(gen).slice(0, 180));
    status.textContent = '生成中\n' + opId;
    let worldId = null;
    for (let i = 0; i < 240; i++) {
      await new Promise(r => setTimeout(r, 4000));
      const op = await fetch('/api/marble/operation/' + encodeURIComponent(opId)).then(async r => {
        const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
      });
      if (op.error) throw new Error(typeof op.error === 'string' ? op.error : JSON.stringify(op.error));
      status.textContent = (op.done ? '完成，正在下载…' : '生成中 ' + (op.progress ?? '') + '%') + '\n' + opId;
      if (op.done) { worldId = op.response?.world_id ?? op.response?.world?.world_id; break; }
    }
    if (!worldId) throw new Error('超时或没有 world_id');
    const slug = document.getElementById('slug').value.trim() || ('world-' + Date.now());
    const saved = await fetch('/api/marble/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ worldId, name: slug }) }).then(async r => {
      const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
    });
    status.textContent = '已保存\n' + Object.values(saved.saved || {}).join('\n');
    await refreshFiles();
    if (saved.saved?.pano) open('/worlds/' + encodeURIComponent(saved.saved.pano));
    else if (saved.saved?.spz) open('/worlds/' + encodeURIComponent(saved.saved.spz));
    refreshCredits();
  } catch (e) {
    status.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
};

// ---------- 拖拽本地文件 ----------
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  e.preventDefault();
  open(URL.createObjectURL(f));
});
</script>
</body>
</html>
