<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marble 世界预览器</title>
<style>
  :root { color-scheme: dark; --ink: #d8d4c8; --dim: #8a877e; --accent: #9db87a; --bg: #0b0b0d; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
               font-family: ui-monospace, "Courier New", monospace; color: var(--ink); }
  #bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; flex-wrap: wrap;
         background: #121216; border-bottom: 1px solid #26262c; font-size: 13px; }
  #bar b { color: var(--accent); }
  select, button { background: #1c1c22; color: var(--ink); border: 1px solid #3a3a44;
                   padding: 5px 10px; border-radius: 4px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #111; }
  #stage { position: fixed; inset: 52px 0 0 0; }
  #stage canvas { display: block; }
  #info { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: var(--dim);
          background: rgba(8,8,10,.7); padding: 4px 10px; border-radius: 4px; pointer-events: none; }
  #empty { position: fixed; inset: 52px 0 0 0; display: grid; place-items: center; color: var(--dim); }
  #empty[hidden] { display: none !important; }   /* 关键：display:grid 会覆盖 hidden 属性，提示层一直拦截鼠标 */
</style>
</head>
<body>
<div id="bar">
  <b>Marble 世界预览</b>
  <select id="fileSel"></select>
  <button id="btnPano">全景图</button>
  <button id="btnMesh">GLB 网格</button>
  <button id="btnSplat">SPZ 点云</button>
  <span id="cost" style="color:var(--dim)"></span>
</div>
<div id="stage"></div>
<div id="empty" hidden>把 .png / .glb / .spz 拖进来，或从左上选已下载的资产</div>
<div id="info"></div>

<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }
</script>
<script type="module">
// ============================================================
// Marble 资产三模式预览（= 接入正式游戏前的渲染技术验证）：
//   全景图  球内贴图 + 拖拽环视     → 终幕实景背景的最简方案
//   GLB     碰撞网格 + orbit        → 现有 prizePool 管线同款
//   SPZ     gaussian-splats-3d 库   → 写实世界最佳观感（最重）
// ============================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as GSplat from '/vendor/addons/gaussian-splats-3d.js';

const stage = document.getElementById('stage');
const info = document.getElementById('info');
const empty = document.getElementById('empty');
const fileSel = document.getElementById('fileSel');
let cleanup = null;   // 当前模式的销毁函数

// ---------- 工具：简单轨道拖拽（pano/mesh 共用） ----------
// 全局按键状态（SELECT/INPUT 聚焦时不劫持，保留下拉框键盘操作）
const keys = new Set();
addEventListener('keydown', e => { const t = e.target.tagName; if (t !== 'INPUT' && t !== 'SELECT' && t !== 'TEXTAREA') keys.add(e.key.toLowerCase()); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// 边界（"墙体碰撞"）：target 与相机都被限制在盒内，撞墙即停
let bounds = null;   // THREE.Box3 | null
function setBounds(box, margin = 0.3) { bounds = box.clone().expandByScalar(-margin); }

function orbitControls(canvas, cam, { min = 1, max = 30, pano = false } = {}) {
  let yaw = 0, pitch = 0, dist = 6, drag = null;
  const target = new THREE.Vector3(0, 0.8, 0);
  const apply = () => {
    if (pano) {   // 球内环视：相机不动，转视线方向
      cam.rotation.set(0, 0, 0, 'YXZ');
      cam.rotation.y = yaw; cam.rotation.x = pitch;
    } else {
      if (bounds) target.clamp(bounds.min, bounds.max);
      cam.position.set(
        target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
        target.y + Math.sin(pitch) * dist + 0.4,
        target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
      if (bounds) cam.position.clamp(bounds.min, bounds.max);   // 相机也不许穿墙
      cam.lookAt(target);
    }
  };
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    // 视角拖拽式：往右拖 = 视线右转；往下拖 = 视线往下看（pano 分支 yaw/pitch 语义本就如此，轨道分支 pitch 取反对齐）
    yaw -= (e.clientX - drag.x) * 0.005;
    pitch += (pano ? -1 : 1) * (e.clientY - drag.y) * 0.005;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    drag = { x: e.clientX, y: e.clientY }; apply();
  });
  canvas.addEventListener('pointerup', () => drag = null);
  if (!pano) canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(min, Math.min(max, dist * Math.exp(e.deltaY * 0.001))); apply(); }, { passive: false });
  // WASD/方向键平移目标点（沿相机水平朝向），QE 升降；帧率无关
  const tick = (t, dt) => {
    if (pano) return;
    const speed = 3 * dt;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    let moved = false;
    if (keys.has('w') || keys.has('arrowup'))    { target.addScaledVector(fwd, speed); moved = true; }
    if (keys.has('s') || keys.has('arrowdown'))  { target.addScaledVector(fwd, -speed); moved = true; }
    if (keys.has('a') || keys.has('arrowleft'))  { target.addScaledVector(right, -speed); moved = true; }
    if (keys.has('d') || keys.has('arrowright')) { target.addScaledVector(right, speed); moved = true; }
    if (keys.has('q')) { target.y -= speed; moved = true; }
    if (keys.has('e')) { target.y += speed; moved = true; }
    if (moved) apply();
  };
  apply();
  return tick;
}

function baseScene() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, stage.clientWidth / stage.clientHeight, 0.05, 200);
  const onResize = () => {
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    camera.aspect = stage.clientWidth / stage.clientHeight;
    camera.updateProjectionMatrix();
  };
  addEventListener('resize', onResize);
  let raf;
  const loop = (fn) => { let last; const tick = (t) => { const dt = Math.min((t - (last ?? t)) / 1000, 0.1); last = t; fn?.(t, dt); renderer.render(scene, camera); raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };
  return { renderer, scene, camera, loop, dispose: () => { cancelAnimationFrame(raf); removeEventListener('resize', onResize); renderer.dispose(); renderer.domElement.remove(); } };
}

// ---------- 模式 1：全景图 ----------
function showPano(url) {
  const { scene, camera, loop, dispose, renderer } = baseScene();
  new THREE.TextureLoader().load(url, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = tex;
    scene.backgroundIntensity = 1;
    info.textContent = '全景图 · 拖拽环视（接入游戏：scene.background 一行的事）';
  });
  camera.position.set(0, 1.6, 0);
  orbitControls(renderer.domElement, camera, { pano: true });
  loop();   // pano 模式相机固定球心，WASD 无视觉意义，不接线
  return dispose;
}

// ---------- 模式 2：GLB 网格 ----------
function showMesh(url) {
  const { scene, camera, loop, dispose, renderer } = baseScene();
  scene.background = new THREE.Color(0x141418);
  scene.add(new THREE.HemisphereLight(0xfff2dd, 0x191a20, 0.7));
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 5, 4); scene.add(key);
  const grid = new THREE.GridHelper(20, 20, 0x333340, 0x222228); scene.add(grid);
  new GLTFLoader().load(url, (gltf) => {
    gltf.scene.rotation.x = Math.PI;   // Marble GLB 同样是反的
    scene.add(gltf.scene);
    // 翻转后重新落地：包围盒底贴回 y=0
    const box = new THREE.Box3().setFromObject(gltf.scene);
    gltf.scene.position.y -= box.min.y;
    const size = box.getSize(new THREE.Vector3());
    // 落地后的精确包围盒 → 边界墙（收缩 0.3m 防贴墙看穿模），线框可视化
    const worldBox = new THREE.Box3().setFromObject(gltf.scene);
    setBounds(worldBox);
    scene.add(new THREE.Box3Helper(worldBox, 0x3a4a5a));
    info.textContent = `GLB 网格 · ${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}m · 拖拽转视角 / 滚轮缩放 / WASD·方向键前后左右 / QE 升降 · 边界内活动（线框为墙）`;
  });
  loop(orbitControls(renderer.domElement, camera));
  return dispose;
}

// ---------- 模式 3：SPZ 高斯点云 ----------
async function showSplat(url) {
  const viewer = new GSplat.Viewer({
    rootElement: stage,
    cameraUp: [0, 1, 0],
    sharedMemoryForWorkers: false,
    useBuiltInControls: false,   // 关掉库自带控制（它的 WASD 是屏幕空间平移、方向键旋转、拖拽轴向反直觉），统一用 orbitControls
  });
  await viewer.addSplatScene(url, { progressiveLoad: false, rotation: [1, 0, 0, 0] });   // Marble SPZ 坐标系与 three 相反：绕 X 翻 180°
  viewer.start();
  // 边界墙：SPZ 无精确包围盒 API，按 Marble 场景尺度给默认盒（同场景精确边界可由 collider GLB 推导）
  const spzBounds = new THREE.Box3(new THREE.Vector3(-8, 0.2, -8), new THREE.Vector3(8, 4, 8));
  setBounds(spzBounds, 0);
  try { viewer.scene.add(new THREE.Box3Helper(spzBounds, 0x3a5a4a)); } catch {}
  // 与 GLB 同款控制：视角拖拽 + WASD/方向键沿地面前后左右 + QE 升降（渲染循环由 viewer 自驱动，这里只跑控制 tick）
  const tick = orbitControls(viewer.renderer.domElement, viewer.camera, { max: 20 });   // 场景 ~16m 宽，dist 上限收紧，配合边界防穿墙
  let last, raf;
  const step = (t) => { const dt = Math.min((t - (last ?? t)) / 1000, 0.1); last = t; tick(t, dt); raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  info.textContent = 'SPZ 点云 · 拖拽转视角 / 滚轮缩放 / WASD·方向键前后左右 / QE 升降 · 边界内活动（线框为墙）';
  return () => { cancelAnimationFrame(raf); try { viewer.dispose(); } catch {} };
}

// ---------- 调度 ----------
function open(url) {
  cleanup?.(); cleanup = null;
  bounds = null;   // 清掉上一个模式的边界
  stage.innerHTML = '';   // 清残留：SPZ Viewer 自带的 DOM dispose 不一定移除干净
  empty.hidden = true;
  const ext = url.split('.').pop().toLowerCase();
  const name = decodeURIComponent(url.split('/').pop());
  document.querySelectorAll('#bar button[data-m]').forEach(b => b.classList.remove('on'));
  const mode = ext === 'png' || ext === 'jpg' || ext === 'webp' ? 'pano' : ext === 'glb' ? 'mesh' : 'splat';
  document.querySelector(`#bar button[data-m="${mode}"]`)?.classList.add('on');
  info.textContent = `加载中… ${name}`;
  if (mode === 'pano') cleanup = showPano(url);
  else if (mode === 'mesh') cleanup = showMesh(url);
  else showSplat(url).then(d => cleanup = d).catch(e => info.textContent = 'SPZ 加载失败：' + e.message);
}

// 强制切模式（比如想用点云看 GLB 之外的文件时用不到，但 tab 要能用）
document.getElementById('btnPano').dataset.m = 'pano';
document.getElementById('btnMesh').dataset.m = 'mesh';
document.getElementById('btnSplat').dataset.m = 'splat';

// ---------- 文件列表 ----------
async function refreshFiles() {
  const { files } = await fetch('/api/marble/files').then(r => r.json()).catch(() => ({ files: [] }));
  fileSel.innerHTML = '<option value="">选择已下载资产…</option>' +
    files.map(f => `<option value="/worlds/${encodeURIComponent(f)}">${f}</option>`).join('');
  if (!files.length) empty.hidden = false;
}
fileSel.addEventListener('change', () => fileSel.value && open(fileSel.value));
refreshFiles();

// ---------- 拖拽本地文件 ----------
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  e.preventDefault();
  open(URL.createObjectURL(f));
});
</script>
</body>
</html>
