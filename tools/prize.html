<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>奖池</title>
<link rel="stylesheet" href="/console-theme.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0c; color: var(--ink);
    font: 13px/1.5 ui-monospace, "Courier New", monospace; }
  body { display: flex; flex-direction: column; min-height: 0; }
  #prizeNav { display: flex; gap: 16px; align-items: center; padding: 8px 16px;
    border-bottom: 1px solid #222228; background: #0e0e12; flex: 0 0 auto; }
  #prizeNav a { color: var(--accent); text-decoration: none; }
  #prizeNav a:hover { text-decoration: underline; }
  #workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
  #list { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #listHead { flex: 0 0 auto; padding: 12px 18px 10px; border-bottom: 1px solid #222228; background: #0a0a0c; }
  #listScroll { flex: 1; min-height: 0; overflow: auto; padding: 8px 18px 28px; }
  h2 { font-size: 12px; letter-spacing: 3px; color: var(--dim); margin: 0 0 8px; font-weight: normal; }
  #prizeSummary { margin-bottom: 8px; }
  #prizeSummary .warn { color: #d7b15a; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid #1e1e24; vertical-align: top; }
  th { color: var(--dim); font-weight: normal; font-size: 11px; }
  .miss { color: var(--dim); }
  .st-paired { color: var(--accent); }
  .st-rot-pending { color: #d7b15a; }
  .st-missing, .st-memory-missing { color: var(--err); }
  .thumb { width: 112px; height: 112px; padding: 0; border: 1px solid #2a2a32; background: #141418;
    display: block; cursor: pointer; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb.on { border-color: var(--accent); }
  .thumb:disabled { cursor: default; }
  .thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 11px; }
  #stage { border-left: 1px solid #222228; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    min-height: 0; overflow: auto; }
  #preview { width: 100%; aspect-ratio: 1; height: auto; background: #141418; border: 1px solid #2a2a32; touch-action: none; flex: 0 0 auto; display: block; }
  #gen { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  #gen label { color: var(--dim); font-size: 11px; }
  #gen input, #gen select, #gen textarea { width: 100%; background: #141418; color: var(--ink);
    border: 1px solid #2a2a32; border-radius: 4px; padding: 6px 8px; font: inherit; }
  #gen textarea { min-height: 72px; resize: vertical; }
  #gen .row { display: flex; gap: 6px; }
  #gen button { background: transparent; color: var(--ink); border: 1px solid #3a3a44;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #genNote { color: var(--dim); white-space: pre-wrap; }
  #stageMeta { color: var(--dim); min-height: 3em; }
  #flash { align-self: flex-start; background: transparent; color: var(--ink); border: 1px solid #3a3a44;
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #flash:disabled { opacity: 0.4; cursor: default; }
  #prizeOrphans { margin-top: 8px; color: var(--dim); font-size: 12px; }
  #prizeOrphans:empty { display: none; }
  .quest-line { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .quest-line input[type="text"] { width: 7.5em; background: #141418; color: var(--ink);
    border: 1px solid #2a2a32; border-radius: 4px; padding: 3px 6px; font: inherit; }
  #questBar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #saveQuest { background: transparent; color: var(--ink); border: 1px solid #3a3a44;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #saveQuest.dirty { color: #1a1a1a; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #syncState.dirty { color: #d7b15a; }
</style>
</head>
<body>
  <nav id="prizeNav">
    <a href="/?tab=prizes" target="_top">返回工具台</a>
    <a id="openAlone" href="/prizes/" target="_blank">单独打开</a>
  </nav>
  <div id="workspace">
  <div id="list">
    <header id="listHead">
      <h2>奖池 · 发布套 good-p2</h2>
      <p id="prizeSummary">加载中…</p>
      <div id="questBar"><span id="syncState" class="miss">正在对照游戏…</span><span id="menuPreview" class="miss"></span><button type="button" id="saveQuest">保存到游戏</button></div>
      <p id="prizeOrphans"></p>
    </header>
    <div id="listScroll">
      <table id="prizeTable"></table>
    </div>
  </div>
  <aside id="stage">
    <h2>预览</h2>
    <canvas id="preview" width="360" height="360"></canvas>
    <p id="stageMeta">点一行里的缩略图。同一机位，按 collider 缩到槽位。</p>
    <button id="flash" type="button" disabled>并排闪切</button>
    <form id="gen">
      <h2>新的一对</h2>
      <p class="miss">只生成还没有的物品。一次出显形态和败露态，并写进游戏。</p>
      <label>名字或一句描述</label>
      <input id="genText" placeholder="咸鱼干 / a dried fish" />
      <label>参考图（可选，只用于显形态）</label>
      <input id="genFile" type="file" accept="image/png,image/jpeg,image/webp" />
      <label>物品 id</label>
      <input id="genId" placeholder="fish" spellcheck="false" />
      <label>显形态提示词</label>
      <textarea id="genMemory"></textarea>
      <label>败露态提示词</label>
      <textarea id="genRot"></textarea>
      <div class="row">
        <button type="button" id="genFill">补全一对</button>
        <button type="button" id="genRun">生成这一对</button>
      </div>
      <p id="genJob"></p>
      <p id="genNote"></p>
    </form>
  </aside>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/": "/vendor/addons/"
    }
  }
  </script>
  <script type="module" src="/prize-view.mjs"></script>
</body>
</html>
