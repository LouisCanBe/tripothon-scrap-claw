name: 生成贪吃蛇动画

# Platane/snk 把 GitHub 贡献日历渲染成贪吃蛇 SVG，推到 output 分支，
# README 里用 raw.githubusercontent.com 引用（不需要提交任何东西，图自动更新）。
# 每天自动跑一次；push 到 master 也会触发。
# permissions：默认 token 是只读的，推 output 分支必须显式开写权限。
permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LouisCanBe
          outputs: |
            dist/github-snake.svg?color_snake=#9db87a&color_dots=#161b22,#243040,#3f6b4f,#9db87a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
